<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Payroll Desk — HyperTrack</title>
<meta name="description" content="Internal payroll desk prototype: connect timesheets, reconcile shifts, prepare payroll, and review sourced rules. Synthetic data.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Design system of closeoutcopilot.com/job, transcribed. Two families only:
   Inter for all UI text; mono strictly for data — ids, clock times, money,
   meta lines, code — plus ONE label treatment (mono 10.5 uppercase wide).
   Grayscale; color exists only as two tinted status pills. */
:root {
  --background: 0 0% 100%;
  --foreground: 0 0% 9%;
  --muted: 0 0% 96%;
  --muted-foreground: 0 0% 42%;
  --border: 0 0% 90%;
  --input: 0 0% 89%;
  --radius: 0.6rem;
  --verify: 38 92% 45%;     /* amber tint: flag / review */
  --pending: 220 70% 52%;   /* blue tint: held */
  --sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; border-color: hsl(var(--border)); touch-action: pan-x pan-y; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; height: 100%; overflow-x: hidden; }
body { font-family: var(--sans); font-size: 13px; line-height: 1.5;
  color: hsl(var(--foreground)); background: hsl(var(--background));
  -webkit-font-smoothing: antialiased; font-feature-settings: 'cv02','cv03','cv04','cv11'; }
*:focus-visible { outline: 2px solid hsl(var(--foreground)); outline-offset: 2px; }
button { font-family: var(--sans); font-size: inherit; line-height: inherit; border: none; background: none; padding: 0; color: inherit; cursor: pointer; text-align: left; }
[hidden] { display: none !important; }

@keyframes fade-in { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
.scroll { scrollbar-width: thin; scrollbar-color: hsl(var(--foreground) / .15) transparent; }
.scroll::-webkit-scrollbar { width: 6px; height: 6px; }
.scroll::-webkit-scrollbar-track { background: transparent; }
.scroll::-webkit-scrollbar-thumb { background: hsl(var(--foreground) / .12); border-radius: 9999px; }
.fade-trunc { overflow: hidden; white-space: nowrap;
  -webkit-mask-image: linear-gradient(to right, black calc(100% - 14px), transparent 100%);
  mask-image: linear-gradient(to right, black calc(100% - 14px), transparent 100%); }
.clamp-2 { overflow: hidden; display: block; max-height: 2.75em; }
.mono { font-family: var(--mono); }

/* THE label — the app's one uppercase treatment (mono 10.5 wide, muted). */
.lbl { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: hsl(var(--muted-foreground)); }
/* THE meta line — mono 11, muted (ids · times · money). */
.count { display: inline-flex; align-items: center; gap: .25rem; font-family: var(--mono); font-size: 11px; color: hsl(var(--muted-foreground)); }
/* THE link — muted underline, darkens on hover. */
.lnk, .memo-link { font-size: 12px; font-weight: 500; color: hsl(var(--muted-foreground));
  text-decoration: underline; text-underline-offset: 2px; text-decoration-color: hsl(var(--border)); }
.lnk:hover, .memo-link:hover { color: hsl(var(--foreground)); }
/* THE button — shadcn outline: real, clickable, never a floating link. */
.btn, .src-link { display: inline-flex; align-items: center; gap: .4rem; height: 2rem;
  padding: 0 .75rem; border-radius: calc(var(--radius) - 2px); border: 1px solid hsl(var(--input));
  background: hsl(var(--background)); box-shadow: 0 1px 2px 0 rgb(0 0 0 / .05);
  font-size: 12px; font-weight: 500; color: hsl(var(--foreground));
  text-decoration: none; white-space: nowrap; max-width: 100%; overflow: hidden;
  transition: background-color .15s; }
.btn:hover, .src-link:hover { background: hsl(var(--muted)); }
.btn svg, .src-link svg { width: .75rem; height: .75rem; flex-shrink: 0; }

/* THE tag — one pill design; amber/blue tinted variants are the only color. */
.tag { display: inline-flex; align-items: center; gap: .3rem; border-radius: 9999px;
  border: 1px solid hsl(var(--border)); background: hsl(var(--muted) / .7);
  color: hsl(var(--muted-foreground)); padding: 1px 8px;
  font-family: var(--sans); font-size: 10.5px; font-weight: 500; line-height: 1rem;
  white-space: nowrap; flex-shrink: 0; vertical-align: baseline; }
.tag.amber { background: hsl(var(--verify) / .08); border-color: hsl(var(--verify) / .25); color: hsl(38 50% 34%); }
.tag.blue { background: hsl(var(--pending) / .08); border-color: hsl(var(--pending) / .25); color: hsl(220 40% 42%); }
.tag.click { font-family: var(--mono); font-weight: 500; cursor: pointer; transition: background-color .12s, color .12s, border-color .12s; }
.tag.click:hover { background: hsl(var(--foreground)); color: hsl(var(--background)); border-color: hsl(var(--foreground) / .4); }
.tag.click svg { width: .625rem; height: .625rem; flex-shrink: 0; }

.icon-btn { display: inline-flex; align-items: center; justify-content: center;
  height: 2.25rem; width: 2.25rem; flex-shrink: 0; border-radius: calc(var(--radius) - 2px);
  color: hsl(var(--foreground)); transition: background-color .15s; }
.icon-btn:hover { background: hsl(var(--muted)); }
.icon-btn.sm { height: 2rem; width: 2rem; }
.icon-btn.sm svg { width: .875rem; height: .875rem; }
.icon-btn.dim { color: hsl(var(--muted-foreground)); }
.icon-btn.dim:hover { color: hsl(var(--foreground)); }
.toolbar .q-input { height: 2rem; font-size: 13px; }
.icon-btn svg { width: 1rem; height: 1rem; }

.q-input { display: flex; height: 2.25rem; min-width: 0; flex: 1;
  border-radius: calc(var(--radius) - 2px); border: 1px solid hsl(var(--input));
  background: hsl(var(--background)); padding: .25rem .75rem;
  font-family: var(--sans); font-size: 14px; color: hsl(var(--foreground));
  box-shadow: 0 1px 2px 0 rgb(0 0 0 / .05); }
.q-input::placeholder { color: hsl(var(--muted-foreground)); }

.chips { display: flex; min-width: 0; flex-wrap: nowrap; gap: .25rem; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { white-space: nowrap; border-radius: 9999px; padding: .25rem .625rem; font-size: 11px; font-weight: 500;
  border: 1px solid hsl(var(--border) / .6); color: hsl(var(--muted-foreground)); }
.chip:hover { background: hsl(var(--muted) / .5); }
.chip.active { border-color: hsl(var(--border)); background: hsl(var(--muted)); color: hsl(var(--foreground)); }

.app { display: flex; flex-direction: column; height: 100dvh; }
.topbar { display: flex; height: 3rem; flex-shrink: 0; align-items: center; gap: .75rem;
  border-bottom: 1px solid hsl(var(--border)); padding: 0 .75rem; }
.back-btn { display: none; align-items: center; gap: .25rem; font-size: 13px; color: hsl(var(--muted-foreground)); }
.back-btn svg { width: 1rem; height: 1rem; }
.topbar .spacer { flex: 1; min-width: 0; }
.topstats { font-family: var(--mono); font-size: 11px; color: hsl(var(--muted-foreground)); white-space: nowrap; display: none; }
@media (min-width: 900px) { .topstats { display: block; } }

.nav-tabs { display: flex; flex-shrink: 0; align-items: center; gap: 2px; padding: 2px;
  border-radius: 9999px; background: hsl(var(--muted)); }
.nav-tabs button { border-radius: 9999px; padding: .25rem .625rem; font-size: 12px; font-weight: 500;
  white-space: nowrap; color: hsl(var(--muted-foreground)); transition: color .15s, background-color .15s; }
.nav-tabs button:hover { color: hsl(var(--foreground)); }
.nav-tabs button.active { background: hsl(var(--background)); color: hsl(var(--foreground)); box-shadow: 0 1px 2px rgb(0 0 0 / .06); }

.main { display: none; flex: 1; min-height: 0; }
.main.on { display: flex; }
.queue { display: flex; width: 100%; flex-shrink: 0; flex-direction: column; border-right: 1px solid hsl(var(--border)); }
.toolbar { display: flex; height: 3.5rem; flex-shrink: 0; align-items: center; gap: .5rem;
  border-bottom: 1px solid hsl(var(--border)); padding: 0 .75rem; }
.case-list { min-height: 0; flex: 1; overflow-y: auto; }
.sect { padding: .625rem .75rem .25rem; }
.case { display: block; width: 100%; border-left: 2px solid transparent; padding: .625rem .75rem;
  transition: background-color .15s, border-color .15s; }
.case:hover { background: hsl(var(--muted) / .4); }
.case.active { border-left-color: hsl(var(--foreground)); background: hsl(var(--muted) / .7); }
.case .row1 { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.case .name { min-width: 0; flex: 1; font-size: 12.5px; font-weight: 500; }
.case .meta { margin-top: .125rem; font-size: 12px; line-height: 1.375; color: hsl(var(--muted-foreground)); }
.case .row3 { display: flex; align-items: center; gap: .375rem; margin-top: .375rem; }

.detail { display: none; min-width: 0; flex: 1; flex-direction: column; }
.info-bar { display: flex; height: 3.5rem; flex-shrink: 0; align-items: center; justify-content: space-between;
  border-bottom: 1px solid hsl(var(--border)); padding: 0 1rem; }
.info-bar .ib-text { min-width: 0; }
.info-bar h2 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.375; }
.info-bar .ib-sub { margin: 0; font-family: var(--mono); font-size: 11px; color: hsl(var(--muted-foreground)); }
.info-bar .ib-right { display: flex; flex-shrink: 0; align-items: center; gap: .625rem; margin-left: .75rem; }
.detail-body { min-height: 0; flex: 1; overflow-y: auto; padding: 1rem 1.25rem 3rem; }

.aux { display: none; width: 380px; flex-shrink: 0; flex-direction: column; border-left: 1px solid hsl(var(--border)); }
@media (min-width: 1100px) { .aux { display: flex; } }
.aux-head { display: flex; height: 3.5rem; flex-shrink: 0; align-items: center; gap: .5rem;
  border-bottom: 1px solid hsl(var(--border)); padding: 0 1rem;
  font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: hsl(var(--muted-foreground)); }
.aux-body { min-height: 0; flex: 1; overflow-y: auto; padding: 1rem 1.25rem 2rem; }
.aux h5 { margin: 1.25rem 0 .375rem; font-family: var(--mono); font-size: 10.5px; font-weight: 500;
  text-transform: uppercase; letter-spacing: .05em; color: hsl(var(--muted-foreground)); }
.aux h5:first-child { margin-top: 0; }
.kv { width: 100%; border-collapse: collapse; font-size: 12px; }
.kv td { border-bottom: 1px solid hsl(var(--border)); padding: .35rem .5rem .35rem 0; vertical-align: top; }
.kv td.k { font-size: 11px; color: hsl(var(--muted-foreground)); white-space: nowrap; width: 42%; }
.kv td:last-child { font-family: var(--mono); font-size: 11.5px; }
.kv tr:last-child td { border-bottom: 0; }
.kv tr.hl-row td { color: hsl(var(--foreground)); }

.payline { margin-top: 1rem; padding-top: .625rem; border-top: 1px solid hsl(var(--border));
  font-family: var(--mono); font-size: 11px; color: hsl(var(--muted-foreground));
  display: flex; gap: 1rem; flex-wrap: wrap; max-width: 46rem; }
.payline b { color: hsl(var(--foreground)); font-weight: 600; }
.payline .up, .payline .dn { color: hsl(var(--foreground)); }

/* The compiler's question — the job app's quote idiom, not a colored callout. */
.ask { border-left: 2px solid hsl(var(--border)); padding: .1rem 0 .1rem .75rem; margin: .75rem 0; max-width: 42rem;
  font-size: 12.5px; line-height: 1.6; color: hsl(var(--foreground) / .8); }
.ask .wq { font-weight: 600; color: hsl(var(--foreground)); }
.ask .wopt { display: inline-block; border: 1px solid hsl(var(--border)); border-radius: 9999px;
  padding: .1rem .55rem; margin: .15rem .25rem 0 0; font-size: 11px; font-weight: 500; color: hsl(var(--muted-foreground)); }
.ask .wopt:hover { background: hsl(var(--muted) / .5); color: hsl(var(--foreground)); }

.r-sent { font-size: 14px; line-height: 1.55; max-width: 42rem; margin: 0 0 .25rem; }
.r-from { font-family: var(--mono); font-size: 11px; color: hsl(var(--muted-foreground)); margin: 0 0 1rem; }
.r-note { font-size: 12px; line-height: 1.55; color: hsl(var(--muted-foreground)); max-width: 42rem; margin: .75rem 0 0; }
.fired { list-style: none; margin: .375rem 0 0; padding: 0; max-width: 42rem; }
.fired li { border-bottom: 1px solid hsl(var(--border) / .7); }
.fired li:last-child { border-bottom: 0; }
.fired button { display: flex; width: 100%; gap: .625rem; padding: .45rem 0; align-items: baseline; font-size: 12.5px; }
.fired button:hover { background: hsl(var(--muted) / .4); }
.fired .fid { font-family: var(--mono); font-size: 11px; }
.fired .fnote { flex: 1; min-width: 0; color: hsl(var(--muted-foreground)); }

/* Source quotes — the job app's Quote idiom: hairline left border, italic. */
.src-entry { padding: .625rem 0; }
.src-entry h6 { margin: 0 0 .25rem; font-size: 12.5px; font-weight: 600; }
.src-quote { border-left: 2px solid hsl(var(--border)); padding: .1rem 0 .1rem .75rem; margin: .5rem 0;
  font-size: 12.5px; font-style: italic; line-height: 1.6; color: hsl(var(--foreground) / .8); }
.src-quote .hl-cite, .hl-cite { border-radius: .25rem; background: hsl(var(--foreground) / .08); padding: 0 .15rem; font-style: normal; color: hsl(var(--foreground)); }
.src-note { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: hsl(var(--muted-foreground)); margin: 0 0 .25rem; }

.scrim { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .2); display: none; }
.scrim.open { display: block; animation: fade-in .15s ease-out; }
.drawer { position: fixed; right: 0; top: 0; z-index: 50; height: 100%; width: 100%; max-width: 480px;
  display: none; flex-direction: column; border-left: 1px solid hsl(var(--border)); background: hsl(var(--background));
  box-shadow: 0 20px 25px -5px rgb(0 0 0 / .1), 0 8px 10px -6px rgb(0 0 0 / .1); }
.drawer.open { display: flex; animation: fade-in .15s ease-out; }
.drawer-head { display: flex; height: 3.5rem; flex-shrink: 0; align-items: center; justify-content: space-between;
  border-bottom: 1px solid hsl(var(--border)); padding: 0 1.25rem; }
.drawer-head .htext { min-width: 0; flex: 1; }
.drawer-title { margin: 0; font-size: 14px; font-weight: 600; }
.drawer-sub { margin: 0; font-family: var(--mono); font-size: 11px; color: hsl(var(--muted-foreground)); }
.drawer-body { min-height: 0; flex: 1; overflow-y: auto; padding: 1rem 1.25rem 2rem; }
@media (min-width: 768px) {
  .topbar { padding: 0 1rem; }
  .queue { width: 320px; }
  .detail { display: flex; }
  .toolbar { padding: 0 1rem; }
  .info-bar { padding: 0 1.25rem; }
}
@media (max-width: 767.98px) {
  .app.mobile-detail .queue { display: none; }
  .app.mobile-detail .detail { display: flex; }
  .app.mobile-detail .back-btn { display: flex; }
  .app.mobile-detail .brand { display: none; }
}

/* Payroll Desk additions use the existing type scale, borders, and pills. */
/* One uniform vendor tile — every system reads at the same weight in the list. */
.tile { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0;
  border-radius: 8px; border: 1px solid hsl(var(--border)); background: #fff; overflow: hidden; }
.tile.lg { width: 44px; height: 44px; border-radius: 10px; }
.tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
.tile img.mark { width: 60%; height: 60%; object-fit: contain; }
.tile svg { width: 16px; height: 16px; color: hsl(var(--muted-foreground)); }
.tile.lg svg { width: 20px; height: 20px; }
.badge { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;
  background: hsl(var(--muted)); font: 10.5px var(--mono); color: hsl(var(--muted-foreground)); }
.tile.lg .badge { font-size: 12px; }
.case.vrow { display: flex; align-items: center; gap: .625rem; }
.case.vrow .rowtext { min-width: 0; flex: 1; }
.ib-text, .row1 .name { min-width: 0; }
.vendor-title, .actions { display: flex; align-items: center; gap: .625rem; flex-wrap: wrap; }
.vendor-title { flex-wrap: nowrap; }
.info-bar { height: auto; min-height: 3.5rem; gap: .5rem; padding-top: .625rem; padding-bottom: .625rem; flex-wrap: wrap; }
.info-bar .ib-right { min-width: 0; max-width: 100%; margin-left: 0; flex-wrap: wrap; }
.detail-body { overflow-x: auto; }
.detail-body h3 { margin: 1.25rem 0 .5rem; font-size: 12.5px; font-weight: 600; }
.detail-body h3:first-child { margin-top: 0; }
.kv td:last-child { overflow-wrap: anywhere; }
.kv.words td:last-child { font-family: var(--sans); font-size: 12px; }
.case .meta.count { display: block; font-size: 11px; }
.case .row3 { flex-wrap: wrap; }
.toolbar .btn, .toolbar [data-addrule] { margin-left: auto; flex-shrink: 0; }
.toolbar .nav-tabs { margin-right: .125rem; }
.sheet-wrap { padding: 0 0 2rem; overflow: auto; }
table.sheet { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sheet th, .sheet td { text-align: left; padding: .625rem .75rem; border-bottom: 1px solid hsl(var(--border)); }
#cycleDetail table.sheet { table-layout: fixed; min-width: 720px; }
#cycleDetail .sheet th, #cycleDetail .sheet td { padding: .35rem .5rem; }
#cycleDetail .sheet .site-name { display: block; width: 100%; max-width: 120px; }
#cycleDetail .sheet .schedule { display: block; }
#cycleDetail .sheet .source-tags { flex-wrap: wrap; }
.sheet thead th { position: sticky; top: 0; background: hsl(var(--background)); z-index: 1; font-weight: 500; }
.sheet tr.grp th { background: hsl(var(--muted)); padding-top: .5rem; padding-bottom: .5rem; font-weight: 500; }
.sheet tr.grp .count { margin-left: .75rem; }
.sheet tr[data-shift] { cursor: pointer; }
.sheet tr[data-shift]:hover td { background: hsl(var(--muted) / .4); }
.sheet tr.sel td { background: hsl(var(--muted) / .7); }
.sheet tr[data-shift] td:first-child { border-left: 2px solid transparent; }
.sheet tr.sel td:first-child { border-left-color: hsl(var(--foreground)); }
.sheet tfoot td { font-weight: 600; background: hsl(var(--muted)); }
.sheet .r-note { white-space: normal; min-width: 12rem; margin: .25rem 0 0; }
.sheet .source-tags { display: flex; gap: .25rem; }
.feed-line { margin: 0; padding: .5rem 0; border-bottom: 1px solid hsl(var(--border)); font: 11px/1.7 var(--mono); }
.empty { padding: 1.25rem; font-size: 12px; color: hsl(var(--muted-foreground)); }
.aux-body.flush { padding: 0 0 2rem; }
.aux-head { height: auto; min-height: 3.5rem; flex-wrap: wrap; padding-top: .625rem; padding-bottom: .625rem; }
.aux-head .count { text-transform: none; letter-spacing: normal; }
.modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 60; display: none; width: 420px; max-width: calc(100% - 2rem); max-height: calc(100dvh - 2rem); overflow-y: auto; background: hsl(var(--background)); border: 1px solid hsl(var(--border)); border-radius: var(--radius); }
.modal.open { display: block; }
.modal .drawer-head { height: auto; min-height: 3.5rem; padding: .75rem 1.25rem; }
.modal label { display: block; margin: .75rem 0 .25rem; font-size: 12px; }
.modal .q-input { width: 100%; }
.modal .chips { margin-bottom: 1rem; }
.toast { position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%); z-index: 70; max-width: calc(100% - 2rem); padding: .625rem 1rem; background: hsl(var(--background)); border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) - 2px); font: 11px/1.5 var(--mono); color: hsl(var(--muted-foreground)); display: none; }
.toast.open { display: block; }
.drop { border: 1px dashed hsl(var(--input)); border-radius: var(--radius); padding: 2rem 1.25rem; margin-top: .75rem; }
.drop.dragging { background: hsl(var(--muted)); }
.composer { width: 100%; min-height: 8rem; resize: vertical; line-height: 1.6; }
.ask .wopt.active { color: hsl(var(--foreground)); background: hsl(var(--muted)); border-color: hsl(var(--foreground)); }
.fired button.btn { height: auto; min-height: 2rem; padding: .5rem .75rem; white-space: normal; margin: .375rem 0; }
.compact-discrepancies { padding: 1rem 1.25rem; border-bottom: 1px solid hsl(var(--border)); }
.drawer-body .actions { margin-top: 1rem; }
button:disabled { cursor: default; opacity: .6; }
@media (min-width: 1100px) { .compact-discrepancies { display: none; } }
@media (max-width: 1199.98px) { .topstats { display: none; } }
@media (max-width: 899.98px) { .memo-link { display: none; } }
@media (max-width: 767.98px) {
  .topbar { gap: .375rem; padding: 0 .5rem; }
  .nav-tabs { min-width: 0; overflow-x: auto; flex-shrink: 1; }
  .nav-tabs button { padding-left: .5rem; padding-right: .5rem; }
  .back-btn span { display: none; }
  .back-btn { width: 24px; flex-shrink: 0; }
  .info-bar { padding-left: 1rem; padding-right: 1rem; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* Reports is the only surface with deck headlines and hero figures. */
#reportDetail { container-type: inline-size; }
#reportDeck { padding: 0; overflow-x: hidden; }
.report-column { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 1.5rem; }

function ruleObj(id){const r=LIVE_RULES.concat(CUSTOM).find(r=>r.id===id);if(r)return {live:true,r};const c=CATALOG.find(c=>c.id===id);return c?{live:false,c}:null;}

// Reconcile: a cycle owns its unmodified engine result and full raw timesheet.
function workerGroups(rows){
  const groups=new Map();for(const r of rows){const k=r.shift.worker;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r);}
  return [...groups].map(([name,shifts])=>({name,shifts:shifts.sort((a,b)=>a.shift.day-b.shift.day||a.shift.punches[0].in-b.shift.punches[0].in)}));
}

}
function discrepancyItems(c=cycle()){
  return c.run.shifts.flatMap(r=>r.rows.filter(isDiscrepancy).map(x=>({r,x}))).sort((a,b)=>Math.abs(b.r.pay-b.r.naive)-Math.abs(a.r.pay-a.r.naive)||a.r.shift.id.localeCompare(b.r.shift.id));

// Payroll: held shifts stay visible but are excluded from outgoing sums.
function payWorkers(c=cycle()){
  return workerGroups(c.run.shifts).map(g=>{
    const approved=g.shifts.filter(r=>!r.held), held=g.shifts.filter(r=>r.held);
    return {name:g.name, approved, held,
      reg:sum(approved,r=>Math.max(0,r.payableMin-sum(r.rows,x=>x.effect?.dailyOtMin||0))),
      ot:sum(approved,r=>sum(r.rows,x=>x.effect?.dailyOtMin||(x.effect?.otPremiumMin||0)*2)),
      premiums:sum(approved,r=>sum(r.rows,x=>(x.effect?.premiumAmt||0)+(x.effect?.premiumHours||0)*r.rate)),
      gross:sum(approved,r=>r.pay)};
  });
}
function payTotals(c=cycle()){
  const workers=payWorkers(c), approved=c.run.shifts.filter(r=>!r.held),held=c.run.shifts.filter(r=>r.held);
  return {workers,approved,held,reg:sum(workers,w=>w.reg),ot:sum(workers,w=>w.ot),premiums:sum(workers,w=>w.premiums),gross:sum(approved,r=>r.pay),naive:sum(approved,r=>r.naive)};
}

// Rules retain the catalog and source corpus, without parameter or trace controls.
function allRules(){return LIVE_RULES.concat(CUSTOM).map(r=>({live:true,r})).concat(CATALOG.map(c=>({live:false,c})));}
function ruleBuckets(){return CUSTOM.length?['Custom',...BUCKETS]:BUCKETS;}

      }else{const c=o.c;html+=`<button class="case${selRule===c.id&&!composer?' active':''}" data-rule="${esc(c.id)}"><div class="row1"><span class="name fade-trunc">${esc(c.name)}</span>${tag('Pack')}</div><div class="meta clamp-2">${esc(c.statement)}</div><div class="row3"><span class="count">${esc(c.id)} · ${esc(c.juris)}</span></div></button>`;}
    }
  }
  $('ruleList').innerHTML=html||empty('No rules match.');
}

function renderRuleDetail(){

  const o=ruleObj(selRule);if(!o){$('ruleDetail').innerHTML=empty('Select a rule.');return;}

    const tip=document.createElement('div');tip.id='reportChartTooltip';tip.className='report-chart-tooltip';tip.setAttribute('role','tooltip');tip.hidden=true;document.body.appendChild(tip);
    deck.addEventListener('pointerover',e=>{const mark=e.target.closest('.report-chart-mark');if(mark&&mark!==reportTooltipMark)showReportTooltip(mark);});
    deck.addEventListener('pointerout',e=>{const mark=e.target.closest('.report-chart-mark');if(mark&&!mark.contains(e.relatedTarget)&&document.activeElement!==mark)hideReportTooltip();});
    deck.addEventListener('focusin',e=>{const mark=e.target.closest('.report-chart-mark');if(mark)showReportTooltip(mark);});
    deck.addEventListener('focusout',e=>{if(e.target.closest('.report-chart-mark'))hideReportTooltip();});
    deck.addEventListener('keydown',e=>{if(e.key==='Escape')hideReportTooltip();});
    deck.addEventListener('scroll',hideReportTooltip,true);
    deck.addEventListener('click',e=>{
      const toggle=e.target.closest('[data-chart-table]');if(!toggle)return;
      const id=toggle.dataset.chartTable,plot=$(id+'-plot'),table=$(id+'-table'),showTable=table.hidden;
      hideReportTooltip();plot.hidden=showTable;table.hidden=!showTable;toggle.textContent=showTable?'Chart':'Table';toggle.setAttribute('aria-pressed',String(showTable));toggle.setAttribute('aria-label',(showTable?'Show chart for ':'Show table for ')+reportChartSpecs.get(id).title);
      if(!showTable)reportDrawChart(plot,plot.getBoundingClientRect().width);
    });
    if(typeof ResizeObserver!=='undefined')reportChartObserver=new ResizeObserver(entries=>entries.forEach(entry=>reportDrawChart(entry.target,entry.contentRect.width)));
    window.addEventListener('resize',()=>{hideReportTooltip();if(!reportChartObserver)deck.querySelectorAll('.report-chart-plot').forEach(host=>reportDrawChart(host,host.getBoundingClientRect().width));});
  }
  deck.querySelectorAll('.report-chart-plot').forEach(host=>{
    if(reportChartObserver&&!reportChartObserved.has(host)){reportChartObserved.add(host);reportChartObserver.observe(host);}
    reportDrawChart(host,host.getBoundingClientRect().width);
  });
}

// REPORT_SECTIONS
// Exact source IDs stay on chips; only the aux list deduplicates display keys.
function reportSourceIds(section){
  const ids=new Set();
  function visit(value){
    if(typeof value==='string'){
      for(const match of value.matchAll(/\[([a-z0-9-]+)\]/g))ids.add(match[1]);
    }else if(Array.isArray(value))value.forEach(visit);
    else if(value&&typeof value==='object'){
      if(value.src)ids.add(value.src);
      Object.values(value).forEach(visit);
    }
  }
  visit(section);return [...ids];
}
function reportCite(id){
  const source=REPORT.sources[id];
  return source?`<button class="tag click report-cite" data-reportcite="${esc(id)}" aria-label="Source: ${esc(source.key)}">${esc(source.key)}</button>`:'';
}
function reportText(text){return esc(text).replace(/\[([a-z0-9-]+)\]/g,(_,id)=>reportCite(id));}
function reportSourceLink(source){return source.url?`<a class="btn" href="${esc(source.url)}" target="_blank" rel="noopener">Open source document ↗</a>`:'';}
function renderReportQueue(){
  const query=Q.reports.trim().toLowerCase();
  $('reportList').innerHTML=REPORT.sections.filter(s=>!query||JSON.stringify(s).toLowerCase().includes(query)).map(s=>`<button class="case${s.id===selReport?' active':''}" data-reportsection="${esc(s.id)}"${s.id===selReport?' aria-current="location"':''}><div class="row1"><span class="count">${esc(s.num)}</span><span class="name">${esc(s.title)}</span></div><div class="meta">${esc(s.sub)}</div></button>`).join('')||empty('No report sections match.');
}
function reportTiles(tiles){
  return `<div class="report-tiles" style="--report-columns:${Math.min(4,tiles.length)}">${tiles.map(t=>`<div class="report-kpi"><p class="report-kpi-label">${esc(t.label)}</p><p class="report-kpi-value">${esc(t.value)}</p>${t.sub?`<p class="count">${esc(t.sub)}</p>`:''}${t.src?reportCite(t.src):''}</div>`).join('')}</div>`;
}
function reportDataTable(table){
  return `<div class="report-table-wrap"><span class="lbl">${esc(table.title)}</span><table class="kv report-table" aria-label="${esc(table.title)}"><thead><tr>${table.cols.map(col=>`<th scope="col">${esc(col)}</th>`).join('')}</tr></thead><tbody>${table.rows.map(row=>`<tr>${row.map(value=>`<td>${esc(value)}</td>`).join('')}</tr>`).join('')}</tbody></table>${table.note?`<p class="report-caption">${esc(table.note)}</p>`:''}<div class="report-table-cite">${table.src?reportCite(table.src):''}</div></div>`;
}
function renderReportLive(){
  const c=cycle();
  for(const section of REPORT.sections.filter(s=>s.live)){
    const target=$('report-live-'+section.id);if(!target)continue;
    target.innerHTML=reportTiles([
      {label:'Flagged shifts',value:String(c.run.totals.flags),sub:c.label+' · synthetic cycle'},
      {label:'Held shifts',value:String(c.run.totals.held),sub:'Excluded from the outgoing batch'},
      {label:'Corrections',value:corrections(c),sub:'Underpay / overpay · held shifts excluded'},
    ]);
  }
}
function renderReportDeck(){
  if(reportReady){renderReportLive();return;}
  const labels={retention:'Retention',cost:'Cost',compliance:'Compliance',timedata:'Time data',economics:'Economics',turnover:'Turnover',reliability:'Reliability',closeout:'Closeout'};
  $('reportDeck').innerHTML=`<div class="report-column">${REPORT.sections.map(section=>`<section class="report-section" id="report-section-${esc(section.id)}" data-reportblock="${esc(section.id)}" aria-labelledby="report-heading-${esc(section.id)}"><div class="lbl">${esc(section.num)} · ${esc(labels[section.id]||section.id)}</div><h2 id="report-heading-${esc(section.id)}" tabindex="-1">${esc(section.title)}</h2><p class="report-sub">${esc(section.sub)}</p>${section.hero?`<div class="report-hero"><span class="report-figure">${esc(section.hero.value)}</span><p class="report-caption">${esc(section.hero.caption)}</p>${reportCite(section.hero.src)}</div>`:''}${section.chart?reportChart(section.chart,section.id+'-chart'):''}${section.chart2?reportChart(section.chart2,section.id+'-chart2'):''}${section.tiles?reportTiles(section.tiles):''}${section.table?reportDataTable(section.table):''}${section.live?`<div id="report-live-${esc(section.id)}" aria-live="polite"></div>`:''}<div class="report-paras">${(section.paras||[]).map(p=>`<p>${reportText(p)}</p>`).join('')}</div>${section.cta?`<button class="btn" data-tab="${esc(section.cta.tab)}">${esc(section.cta.label)}</button>`:''}</section>`).join('')}</div>`;
  reportReady=true;renderReportLive();initReportCharts();
  const deck=$('reportDeck');
  const scheduleUpdate=()=>{
    if(reportScrollFrame!==null)return;
    reportScrollFrame=requestAnimationFrame(()=>{reportScrollFrame=null;updateActiveReport();});
  };
  if(typeof IntersectionObserver!=='undefined'){
    reportObserver=new IntersectionObserver(scheduleUpdate,{root:deck,rootMargin:'0px 0px -60% 0px',threshold:[0,.01,.25]});
    deck.querySelectorAll('[data-reportblock]').forEach(block=>reportObserver.observe(block));
  }
  // Also track the anchor within sections taller than the observer's root band.
  deck.addEventListener('scroll',scheduleUpdate,{passive:true});
}
function setActiveReport(id){
  if(selReport===id)return;selReport=id;
  $('reportList').querySelectorAll('[data-reportsection]').forEach(button=>{
    const on=button.dataset.reportsection===id;button.classList.toggle('active',on);
    if(on)button.setAttribute('aria-current','location');else button.removeAttribute('aria-current');
  });
  renderReportAux();
}
function updateActiveReport(){
  const deck=$('reportDeck');if(tab!=='reports'||!deck.clientHeight)return;
  const anchor=deck.getBoundingClientRect().top+Math.min(120,deck.clientHeight*.25);
  let active=REPORT.sections[0].id;
  for(const block of deck.querySelectorAll('[data-reportblock]')){
    if(block.getBoundingClientRect().top<=anchor)active=block.dataset.reportblock;else break;
  }
  setActiveReport(active);
}
function goReportSection(id){
  if(!REPORT.sections.some(s=>s.id===id))return;
  closeOverlay();if(tab!=='reports')setTab('reports');setMobileDetail(true);setActiveReport(id);
  requestAnimationFrame(()=>{
    initReportCharts();
    const deck=$('reportDeck'),section=$('report-section-'+id);
    const top=section.getBoundingClientRect().top-deck.getBoundingClientRect().top+deck.scrollTop;
    const reduced=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    deck.scrollTo({top,behavior:reduced?'auto':'smooth'});
    $('report-heading-'+id).focus({preventScroll:true});
  });
}
function renderReportAux(){
  const section=REPORT.sections.find(s=>s.id===selReport),keys=new Set();
  const sources=reportSourceIds(section).map(id=>REPORT.sources[id]).filter(source=>{
    if(keys.has(source.key))return false;keys.add(source.key);return true;
  });
  $('reportAux').innerHTML=`<div class="aux-head lbl">Sources</div><div class="aux-body scroll">${sources.map(source=>`<div class="src-entry"><p class="report-publisher">${esc(source.publisher)}</p><h6>${esc(source.title)}</h6><span class="count report-source-year">${esc(source.year)} · ${esc(source.key)}</span>${tag(source.confidence)}<div class="actions" style="margin-top:.75rem">${reportSourceLink(source)}</div></div>`).join('')||empty('Live figures from this synthetic pay cycle.')}</div>`;
}
function renderReportSourceDrawer(){
  const source=REPORT.sources[drawerSource];if(!source)return;
  const sections=REPORT.sections.filter(section=>reportSourceIds(section).includes(drawerSource));
  $('drawer').innerHTML=`<div class="drawer-head"><h3 class="drawer-title">Source</h3><button class="icon-btn" data-closeoverlay="1" aria-label="Close drawer">${ICO_X}</button></div><div class="drawer-body scroll"><div class="actions"><span class="tag report-cite">${esc(source.key)}</span>${tag(source.confidence)}</div><div class="src-entry"><p class="report-publisher">${esc(source.publisher)}</p><h6>${esc(source.title)} (${esc(source.year)})</h6><div class="src-quote">${esc(source.quote)}</div><div class="actions">${reportSourceLink(source)}</div></div><div class="report-cited-in"><h3 class="lbl">Cited in</h3><ul class="fired">${sections.map(section=>`<li><button class="btn" data-reportsection="${esc(section.id)}"><span class="fid">${esc(section.num)}</span><span>${esc(section.title)}</span></button></li>`).join('')}</ul></div></div>`;
}
function renderReports(){renderReportQueue();renderReportDeck();renderReportAux();}

// Shell, single-row search toolbars, and delegated actions.
function setMobileDetail(on){$('app').classList.toggle('mobile-detail',on);}
// 'connect' is the nav button; the two connection screens stay separate mains.
const NAV_OF={sources:'connect',payroll:'connect',reconcile:'reconcile',rules:'rules',reports:'reports'};
function setTab(next){
  if(next==='connect')next=connectSub;
  if(!['sources','reconcile','payroll','rules','reports'].includes(next))return;
  hideReportTooltip();
  tab=next;if(NAV_OF[tab]==='connect')connectSub=tab;
  document.querySelectorAll('#navTabs button').forEach(b=>{const on=b.dataset.tab===NAV_OF[tab];b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  document.querySelectorAll('.main').forEach(m=>m.classList.toggle('on',m.id==='m-'+tab));setMobileDetail(false);renderAll();
  if(tab==='reports')requestAnimationFrame(()=>{initReportCharts();updateActiveReport();});
}
// Connect's sub-tabs wear the nav pill so the two levels read as one control family.
function connectSubTabs(){
  return `<nav class="nav-tabs" aria-label="Connection screens">${[['sources','Timesheets'],['payroll','Payroll']].map(([id,label])=>`<button data-tab="${id}"${tab===id?' class="active" aria-current="page"':''}>${label}</button>`).join('')}</nav>`;
}
function toolbarChips(t){
  if(t==='reports')return '';
  if(t==='rules')return `<div class="chips">${['All',...ruleBuckets()].map(b=>`<button class="chip${bucketFilter===b?' active':''}" data-bucket="${esc(b)}">${esc(b)}</button>`).join('')}</div>`;
  return `<div class="chips">${['all','open','paid'].map(v=>`<button class="chip${cycleFilter===v?' active':''}" data-filter="${t}" data-value="${v}">${title(v)}</button>`).join('')}</div>`;
}
function renderToolbar(t){
  const connect=t==='sources'||t==='payroll';
  const search=searchOpen[t]?`<button class="icon-btn sm dim" data-stoggle="${t}" aria-label="Close search">${ICO_X}</button><input class="q-input" data-q="${t}" value="${esc(Q[t])}" placeholder="Search" aria-label="Search ${t}">`:`<button class="icon-btn sm dim" data-stoggle="${t}" aria-label="Search ${t}">${ICO_SEARCH}</button>${connect?'':toolbarChips(t)}`;
  $('tb-'+t).innerHTML=(connect?connectSubTabs():'')+search+(t==='rules'?`<button class="icon-btn sm dim" data-addrule="1" aria-label="Add rule">${ICO_PLUS}</button>`:'');
}
function renderSources(){renderSourceQueue();renderSourceDetail();renderSourceAux();}
function renderReconcile(){renderCycleQueue();renderCycleDetail();renderCycleAux();}
function renderPayroll(){renderPayrollQueue();renderPayrollDetail();renderPayrollAux();}
function renderRules(){renderRuleQueue();renderRuleDetail();renderRuleAux();}
const QUEUE_RENDER={sources:renderSourceQueue,reconcile:renderCycleQueue,payroll:renderPayrollQueue,rules:renderRuleQueue,reports:renderReportQueue};
function renderAll(){renderTop();Object.keys(QUEUE_RENDER).forEach(renderToolbar);renderSources();renderReconcile();renderPayroll();renderRules();renderReports();if(drawer||drawerSource)renderDrawer();}

document.addEventListener('input',e=>{
  if(e.target.dataset.q){const k=e.target.dataset.q;Q[k]=e.target.value;QUEUE_RENDER[k]();}
  if(e.target.id==='ruleSentence'&&composer){composer.sentence=e.target.value;const b=document.querySelector('[data-compilecustom]');if(b)b.disabled=!composer.sentence.trim();}
});
document.addEventListener('change',e=>{if(e.target.id==='uploadFile'&&e.target.files?.length)parseUpload();});
document.addEventListener('submit',e=>{if(e.target.id==='connectForm'){e.preventDefault();continueConnection();}});
document.addEventListener('dragover',e=>{const drop=e.target.closest?.('#uploadDrop');if(drop){e.preventDefault();drop.classList.add('dragging');}});
document.addEventListener('dragleave',e=>{const drop=e.target.closest?.('#uploadDrop');if(drop)drop.classList.remove('dragging');});
document.addEventListener('drop',e=>{const drop=e.target.closest?.('#uploadDrop');if(drop){e.preventDefault();drop.classList.remove('dragging');if(e.dataTransfer.files.length)parseUpload();}});
$('scrim').addEventListener('click',()=>closeOverlay());
$('backBtn').addEventListener('click',()=>setMobileDetail(false));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){hideReportTooltip();closeOverlay();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-shift]')){e.preventDefault();selectShift(e.target.dataset.shift);return;}
  if(e.key==='Tab'&&(drawer||drawerSource||connection)){
    const root=$(connection?'modal':'drawer');const focusable=[...root.querySelectorAll('button:not(:disabled),a[href],input,textarea,[tabindex="0"]')].filter(el=>!el.hidden);
    const first=focusable[0],last=focusable[focusable.length-1];
    if(!first){e.preventDefault();root.focus();}
    else if(e.shiftKey&&(document.activeElement===first||document.activeElement===root)){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===root)){e.preventDefault();first.focus();}
  }
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-tab],[data-stoggle],[data-filter],[data-source],[data-cycle],[data-dest],[data-sfilter],[data-shift],[data-discrepancy],[data-rule],[data-bucket],[data-goshift],[data-gorule],[data-cite],[data-closeoverlay],[data-connect],[data-connectmethod],[data-sync],[data-choosefile],[data-openreconcile],[data-approve],[data-send],[data-addrule],[data-compilecustom],[data-answer],[data-adddraft],[data-editdraft],[data-cancelrule],[data-reportsection],[data-reportcite]');
  if(!el||el.disabled)return;const d=el.dataset;
  if(d.reportsection)return goReportSection(d.reportsection);
  if(d.reportcite)return openDrawer(null,null,null,d.reportcite);
  if(d.tab)return setTab(d.tab);
  if(d.stoggle){const t=d.stoggle;searchOpen[t]=!searchOpen[t];if(!searchOpen[t]){Q[t]='';QUEUE_RENDER[t]();}renderToolbar(t);if(searchOpen[t])$('tb-'+t).querySelector('input').focus();return;}
  if(d.filter){cycleFilter=d.value;renderToolbar(d.filter);QUEUE_RENDER[d.filter]();return;}
  if(d.source){selSource=d.source;setMobileDetail(true);renderSources();return;}
  if(d.cycle){selCycle=d.cycle;if(!cycle().week.some(s=>s.id===selShift))selShift=cycle().week[0].id;setMobileDetail(true);renderAll();return;}
  if(d.dest){selDest=d.dest;setMobileDetail(true);renderPayroll();return;}
  if(d.sfilter){shiftFilter=d.sfilter;renderCycleDetail();return;}
  if(d.discrepancy){shiftFilter='all';selectShift(d.forShift,true);openDrawer(d.discrepancy,d.forShift,Number(d.rowIndex));return;}
  if(d.shift){selectShift(d.shift);return;}
  if(d.rule){selRule=d.rule;composer=null;setMobileDetail(true);renderRules();return;}
  if(d.bucket){bucketFilter=d.bucket;renderToolbar('rules');renderRuleQueue();return;}
  if(d.goshift)return goShift(d.goshift);
  if(d.gorule){closeOverlay();selRule=d.gorule;composer=null;bucketFilter='All';Q.rules='';setTab('rules');setMobileDetail(true);return;}
  if(d.cite)return openDrawer(d.cite);
  if(d.closeoverlay)return closeOverlay();
  if(d.connect)return openConnection(d.connect);
  if(d.connectmethod&&connection?.step==='form'){connection.method=d.connectmethod;renderConnection();return;}
  if(d.sync)return syncSource(d.sync);
  if(d.choosefile){$('uploadFile').click();return;}
  if(d.openreconcile){setTab('reconcile');setMobileDetail(true);return;}
  if(d.approve){const c=cycle();c.approved=true;renderTop();renderReconcile();toast(`${c.run.shifts.filter(r=>!r.held).length} shifts approved · ${c.run.totals.held} held`);return;}
  if(d.send)return sendBatch();
  if(d.addrule){composer={sentence:'',compiling:false};setMobileDetail(true);renderRules();$('ruleSentence').focus();return;}
  if(d.compilecustom)return compileCustom();
  if(d.answer&&composer){composer.answer=d.answer;renderComposer();return;}
  if(d.adddraft)return addDraft();
  if(d.editdraft&&composer){composer={sentence:composer.sentence,compiling:false};renderComposer();return;}
  if(d.cancelrule){composer=null;renderRules();return;}
});
renderAll();
})();
</script>
</body>
