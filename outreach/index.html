<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Closeout Outreach</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
:root{--bg:#F6F6F4;--card:#FFFFFF;--ink:#1B1D1A;--muted:#71756D;--line:#E6E5E0;--soft:#F1F0EC}
.staticrypt-html{height:100%}
.staticrypt-body{height:100%;margin:0}
.staticrypt-content{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center}
.staticrypt-page{width:380px;max-width:calc(100vw - 48px);margin:0;padding:0;box-sizing:border-box}
.staticrypt-form{position:relative;z-index:1;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0;padding:28px 28px 24px;text-align:left;box-shadow:0 1px 3px rgb(27 29 26/.06)}
.staticrypt-title{font-size:17px;font-weight:650;letter-spacing:-.01em;margin:0 0 2px}
.staticrypt-instructions{margin:0 0 4px}
.staticrypt-instructions p{margin:0}
.staticrypt-instructions p:not(.staticrypt-title){color:var(--muted);font-size:13px}
.staticrypt-hr{margin:16px 0;border:0;border-top:1px solid var(--line)}
.staticrypt-password-container{position:relative;background:var(--card);width:100%;border:1px solid var(--line);border-radius:8px;margin:0 0 14px;box-sizing:border-box}
.staticrypt-password-container:focus-within{border-color:var(--ink);outline:2px solid rgb(27 29 26/.12);outline-offset:1px}
.staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{background:transparent;border:0;box-sizing:border-box;font-size:14px;outline:0;padding:10px 42px 10px 12px;width:100%;color:var(--ink);border-radius:8px}
.staticrypt-toggle-password-visibility{cursor:pointer;height:16px;width:16px;opacity:45%;padding:12px;position:absolute;right:0;top:50%;transform:translateY(-50%)}
label.staticrypt-remember{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-size:13px;color:var(--muted)}
.staticrypt-remember input[type="checkbox"]{accent-color:var(--ink);width:15px;height:15px;margin:0}
.staticrypt-form .staticrypt-decrypt-button{outline:0;background:var(--ink);width:100%;border:0;border-radius:8px;padding:10px;color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
.staticrypt-form .staticrypt-decrypt-button:hover{filter:brightness(1.25)}
.staticrypt-form .staticrypt-decrypt-button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hidden{display:none !important}
.staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center}
.staticrypt-spinner{display:inline-block;width:2rem;height:2rem;border:.25em solid var(--line);border-right-color:transparent;border-radius:50%;animation:spinner-border .75s linear infinite}
@keyframes spinner-border{100%{transform:rotate(360deg)}}
</style>
    </head>
