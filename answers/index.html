<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dispute Answers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/job/config.js"></script>
<style>
/* Design language: /bench (ShopStream restraint) — B&W Inter 13px, mono chips, 480px source drawer. */
:root {
  --background: 0 0% 100%; --foreground: 0 0% 9%; --muted: 0 0% 96%; --muted-foreground: 0 0% 42%;
  --border: 0 0% 90%; --sans: 'Inter', ui-sans-serif, system-ui, sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--sans); font-size: 13px; line-height: 1.5; color: hsl(var(--foreground)); background: hsl(var(--background)); -webkit-font-smoothing: antialiased; }
.lbl { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: hsl(var(--muted-foreground)); }
.gate { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; color: hsl(var(--muted-foreground)); font-size: 12px; }
.err { color: hsl(0 70% 45%); }
.app { display: flex; flex-direction: column; height: 100%; }
.top { display: flex; align-items: center; gap: .75rem; height: 3rem; flex-shrink: 0; padding: 0 16px; border-bottom: 1px solid hsl(var(--border)); }
.top img { height: 18px; }
.bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .75rem; padding: .75rem 16px; border-bottom: 1px solid hsl(var(--border)); }
.bar h1 { margin: 0; font-size: 14px; font-weight: 600; }
.wrap { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: separate; border-spacing: 0; }
th, td { border-right: 1px solid hsl(var(--border)); border-bottom: 1px solid hsl(var(--border)); padding: .6rem .75rem; vertical-align: top; text-align: left; width: 220px; min-width: 220px; }
thead th { position: sticky; top: 0; z-index: 2; background: hsl(var(--background)); font-weight: 600; }
.co { display: flex; align-items: center; gap: .5rem; }
.co img, .co .ph { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; object-fit: contain; }
.co .ph { background: hsl(var(--muted)); border: 1px solid hsl(var(--border)); }
.who { display: block; margin-top: .2rem; font-family: var(--mono); font-size: 10.5px; font-weight: 400; color: hsl(var(--muted-foreground)); line-height: 1.35; }
th.q, td.q { position: sticky; left: 0; z-index: 1; background: hsl(var(--muted)); width: 150px; min-width: 150px; color: hsl(var(--foreground)); font-weight: 500; font-size: 12px; }
thead th.q { z-index: 3; }
td.sec { position: sticky; left: 0; background: hsl(var(--background)); border-right: 0; padding-top: 1rem; }
.ans + .ans { margin-top: .5rem; padding-top: .5rem; border-top: 1px dashed hsl(var(--border)); }
.tag { display: inline-flex; align-items: center; gap: .3rem; border-radius: 9999px; border: 1px solid hsl(var(--border)); background: hsl(var(--muted)); padding: 0 .45rem; font-size: 10px; line-height: 1.6; color: hsl(var(--muted-foreground)); white-space: nowrap; vertical-align: 1px; margin-left: .25rem; }
.tag.click { font-family: var(--mono); font-weight: 500; cursor: pointer; transition: background-color .12s, color .12s, border-color .12s; }
.tag.click:hover { background: hsl(var(--foreground)); color: hsl(var(--background)); border-color: hsl(var(--foreground) / .4); }
.btn { display: inline-flex; align-items: center; gap: .4rem; height: 2rem; padding: 0 .75rem; border: 1px solid hsl(var(--border)); border-radius: .5rem; background: hsl(var(--background)); color: hsl(var(--foreground)); font: 500 12.5px var(--sans); text-decoration: none; cursor: pointer; }
.btn:hover { background: hsl(var(--muted)); }
.scrim { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .2); display: none; }
.scrim.open { display: block; }
.drawer { position: fixed; right: 0; top: 0; z-index: 50; height: 100%; width: 100%; max-width: 480px; display: none; flex-direction: column; background: hsl(var(--background)); border-left: 1px solid hsl(var(--border)); box-shadow: -8px 0 24px rgb(0 0 0 / .06); }
.drawer.open { display: flex; }
.drawer-head { display: flex; height: 3.5rem; flex-shrink: 0; align-items: center; justify-content: space-between; gap: .75rem; padding: 0 1.25rem; border-bottom: 1px solid hsl(var(--border)); }
.drawer-title { margin: 0; font-size: 14px; font-weight: 600; }
.drawer-sub { margin: 0; font-family: var(--mono); font-size: 11px; color: hsl(var(--muted-foreground)); }
.drawer-body { min-height: 0; flex: 1; overflow-y: auto; padding: 1rem 1.25rem 2rem; }
.drawer-body p { margin: .25rem 0; }
.src-quote { border-left: 2px solid hsl(var(--border)); padding: .1rem 0 .1rem .75rem; margin: .75rem 0; color: hsl(var(--foreground)); }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
.tx { margin-top: 1rem; font-size: 12.5px; white-space: pre-wrap; color: hsl(var(--muted-foreground)); }
.tx mark { background: hsl(var(--foreground) / .1); color: hsl(var(--foreground)); border-radius: .25rem; padding: 0 .15rem; }
@media (min-width: 760px) { th.q, td.q { width: 260px; min-width: 260px; font-size: 12.5px; } }
</style>
</head>
<body>
<div id="gate" class="gate">
  <div>Internal — hypertrack.io accounts</div>
  <div id="btn"></div>
  <div id="gateErr" class="err"></div>
</div>
<div id="app" class="app" hidden>
  <div class="top"><img src="/logo-small.svg" alt="HyperTrack"></div>
  <div class="bar"><h1>Dispute resolution, by company</h1><span class="lbl" id="meta"></span></div>
  <div class="wrap"><table id="t"></table></div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Source">
  <div class="drawer-head"><div><p class="drawer-title" id="dTitle"></p><p class="drawer-sub" id="dSub"></p></div><button class="btn" id="dClose">Close</button></div>
  <div class="drawer-body" id="dBody"></div>
</aside>
<script>
// ponytail: reuses /job's Google sign-in + viewer session (same origin, same localStorage key); data sits behind it on the AK server.
const API = 'https://agent-keyboard.fly.dev/sites/closeout-jobs'
const KEY = 'job:viewer-session:v1'
const $ = id => document.getElementById(id)
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
let DATA, TOKEN

function session() {
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); return s && s.sessionToken && s.exp * 1000 > Date.now() ? s : null } catch { return null }
}
const authed = path => fetch(`${API}/files/${path}`, { headers: { Authorization: `Bearer ${TOKEN}` } })

async function load(token) {
  TOKEN = token
  const res = await authed('answers/answers.json')
  if (res.status === 401 || res.status === 403) { try { localStorage.removeItem(KEY) } catch {} return signIn() }
  if (!res.ok) { $('gateErr').textContent = `Could not load answers (${res.status}).`; return }
  DATA = await res.json(); render()
}

function signIn() {
  $('gate').hidden = false; $('app').hidden = true
  const go = () => {
    google.accounts.id.initialize({
      client_id: window.__GOOGLE_CLIENT_ID, auto_select: true,
      callback: async ({ credential }) => {
        const res = await fetch(`${API}/session`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idToken: credential }) })
        if (!res.ok) { $('gateErr').textContent = 'hypertrack.io accounts only.'; return }
        const s = await res.json(); try { localStorage.setItem(KEY, JSON.stringify(s)) } catch {}
        load(s.sessionToken)
      },
    })
    google.accounts.id.renderButton($('btn'), { theme: 'outline', size: 'large', text: 'signin_with' })
    google.accounts.id.prompt()
  }
  if (window.google) return go()
  const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.onload = go; document.head.appendChild(sc)
}

const SRC = { gong: 'Gong', hubspot: 'HubSpot', slack: 'Slack', interview: 'Interview' }
function render() {
  $('gate').hidden = true; $('app').hidden = false
  const cos = DATA.companies
  $('meta').textContent = `${cos.length} companies · ${DATA.questions.length} questions · updated ${new Date(DATA.updatedAt).toLocaleDateString()}`
  const logo = c => c.logo ? `<img src="${esc(c.logo)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=ph></span>'">` : '<span class="ph"></span>'
  const head = `<thead><tr><th class="q lbl">Question</th>${cos.map(c => `<th><div class="co">${logo(c)}<span>${esc(c.company)}</span></div>${c.people ? `<span class="who">${esc(c.people)}</span>` : ''}</th>`).join('')}</tr></thead>`
  const body = DATA.questions.map((q, i) => `<tr><td class="q">${esc(q)}</td>${cos.map((c, ci) => `<td>${(c.cells['Q' + (i + 1)] || []).map((a, ai) =>
    `<div class="ans">${esc(a.a)} <span class="tag click" data-c="${ci}" data-q="${i + 1}" data-a="${ai}">${esc(a.cite.label)}</span></div>`).join('')}</td>`).join('')}</tr>`).join('')
  $('t').innerHTML = head + '<tbody>' + body + '</tbody>'
}

function openDrawer(c, q, a) {
  const co = DATA.companies[c], ans = co.cells['Q' + q][a], s = ans.cite
  $('dTitle').textContent = co.company
  $('dSub').textContent = [SRC[s.src], s.title, s.date].filter(Boolean).join(' · ')
  const link = s.url ? `<a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">Open in ${SRC[s.src]} ↗</a>` : ''
  const tx = s.path ? `<button class="btn" id="dTx">Show full transcript</button>` : ''
  $('dBody').innerHTML = `<p class="lbl">Q${q}</p><p>${esc(DATA.questions[q - 1])}</p><p class="lbl" style="margin-top:1rem">Answer</p><p>${esc(ans.a)}</p><div class="src-quote">“${esc(s.quote)}”</div>${s.speaker ? `<p class="drawer-sub">${esc(s.speaker)}</p>` : ''}<div class="actions">${link}${tx}</div><div class="tx" id="dTxBody"></div>`
  if (s.path) $('dTx').onclick = () => showTranscript(s)
  $('drawer').classList.add('open'); $('scrim').classList.add('open')
}
async function showTranscript(s) {
  const el = $('dTxBody'); el.textContent = 'Loading…'
  const res = await authed(s.path)
  if (!res.ok) { el.textContent = `Could not load transcript (${res.status}).`; return }
  const text = await res.text()
  // Highlight the longest quote fragment found verbatim, then scroll to it.
  const frag = s.quote.split(/\s*\.\.\.\s*|…/).sort((x, y) => y.length - x.length)[0].trim()
  const at = frag ? text.toLowerCase().indexOf(frag.toLowerCase()) : -1
  el.innerHTML = at < 0 ? esc(text) : esc(text.slice(0, at)) + '<mark id="hit">' + esc(text.slice(at, at + frag.length)) + '</mark>' + esc(text.slice(at + frag.length))
  $('hit')?.scrollIntoView({ block: 'center' })
}
function closeDrawer() { $('drawer').classList.remove('open'); $('scrim').classList.remove('open') }

$('t').addEventListener('click', e => { const t = e.target.closest('.tag.click'); if (t) openDrawer(+t.dataset.c, +t.dataset.q, +t.dataset.a) })
$('scrim').onclick = closeDrawer; $('dClose').onclick = closeDrawer
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer() })

const s = session()
s ? load(s.sessionToken) : signIn()
</script>
<script src="https://agent-keyboard.fly.dev/widget.js" data-site="closeout" defer></script>
</body>
</html>
