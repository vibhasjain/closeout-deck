<style>

.sk { display: block; height: 12px; border-radius: 4px; background: linear-gradient(90deg, hsl(var(--muted)) 0%, hsl(0 0% 91%) 50%, hsl(var(--muted)) 100%); background-size: 200% 100%; animation: sk 1.2s ease-in-out infinite; }

<script>
// ponytail: reuses /job's Google sign-in + viewer session (same origin, same localStorage key); data sits behind it on the AK server.
const API = 'https://agent-keyboard.fly.dev/sites/closeout-jobs'
const KEY = 'job:viewer-session:v1'
const $ = id => document.getElementById(id)
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
let DATA, TOKEN, VIEW = []

function session() {
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); return s && s.sessionToken && s.exp * 1000 > Date.now() ? s : null } catch { return null }
}
const authed = path => fetch(`${API}/files/${path}`, { headers: { Authorization: `Bearer ${TOKEN}` } })

function skeleton() {
  $('gate').hidden = true; $('app').hidden = false
  const cols = 8, w = ['70%', '90%', '55%', '80%', '65%']
  const cell = (i, n) => Array.from({ length: n }, (_, k) => `<span class="sk" style="width:${w[(i + k) % w.length]}"></span>`).join('')
  $('t').innerHTML = `<thead><tr><th class="q"></th>${Array.from({ length: cols }, (_, i) => `<th><span class="sk" style="width:60%"></span></th>`).join('')}</tr></thead><tbody>${Array.from({ length: 12 }, (_, r) => `<tr><td class="q">${cell(r, 2)}</td>${Array.from({ length: cols }, (_, c) => `<td>${cell(r + c, 3)}</td>`).join('')}</tr>`).join('')}</tbody>`
}

async function load(token) {
  TOKEN = token
  const res = await authed('answers/answers.json')
  if (res.status === 401 || res.status === 403) { try { localStorage.removeItem(KEY) } catch {} return signIn() }
  if (!res.ok) { $('t').innerHTML = `<tbody><tr><td class="q">Could not load answers (${res.status}). Refresh to try again.</td></tr></tbody>`; return }
  DATA = await res.json(); render()
}

function signIn() {
  $('gate').hidden = false; $('app').hidden = true
  const go = () => {
    google.accounts.id.initialize({
      client_id: window.__GOOGLE_CLIENT_ID, auto_select: true,
      callback: async ({ credential }) => {
        const res = await fetch(`${API}/session`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idToken: credential }) })
        if (!res.ok) { $('gateErr').textContent = 'hypertrack.io accounts only.'; return }
        const s = await res.json(); try { localStorage.setItem(KEY, JSON.stringify(s)) } catch {}
        skeleton(); load(s.sessionToken)
      },
    })
    google.accounts.id.renderButton($('btn'), { theme: 'outline', size: 'large', text: 'signin_with' })
    google.accounts.id.prompt()
  }
  if (window.google) return go()
  const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.onload = go; document.head.appendChild(sc)
}

// "Adam Varro (Sr. Dir. Service)" -> name + title; first 3 shown, the rest behind a toggle.
const person = (p, li = {}) => { const m = p.match(/^(.*?)\s*\((.*)\)\s*$/); const [n0, t] = m ? [m[1], m[2]] : [p, '']; const n = /[A-Z]{3,}/.test(n0) && n0 === n0.toUpperCase() ? n0.toLowerCase().replace(/\b\w/g, x => x.toUpperCase()) : n0; const u = li[n] || li[n0]; return `<li><div><span class="pn">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${hl(n)}</a>` : hl(n)}</span>${t ? `<span class="pt">${hl(t[0].toUpperCase() + t.slice(1))}</span>` : ''}</div></li>` }
const people = (p, li) => { const a = (p || '').split(' · ').filter(x => x && !/unidentified|unnamed|unknown|anonymi|merged audio|\[/i.test(x.replace(/\s*\(.*\)\s*$/, ''))); return a.length ? `<ul class="ppl">${a.map(x => person(x, li)).join('')}</ul>` : '' }
// One unit only: "12 minutes ago", "3 hours ago", "2 days ago".
const ago = d => { const m = Math.max(1, Math.round((Date.now() - d) / 60000)); if (m >= 525600) { const y = +(m / 525600).toFixed(1); return `${y} year${y === 1 ? '' : 's'} ago` }; const [n, u] = m < 60 ? [m, 'min'] : m < 1440 ? [Math.round(m / 60), 'hr'] : [Math.round(m / 1440), 'day']; return `${n} ${u}${n === 1 ? '' : 's'} ago` }
// lucide: building-2, circle-help, message-square-quote

const SRC_ICON = {
  hubspot: fill('M18.164 7.93V5.084a2.198 2.198 0 001.267-1.978v-.067A2.2 2.2 0 0017.238.845h-.067a2.2 2.2 0 00-2.193 2.193v.067a2.196 2.196 0 001.252 1.973l.013.006v2.852a6.22 6.22 0 00-2.969 1.31l.012-.01-7.828-6.095A2.497 2.497 0 104.3 4.656l-.012.006 7.697 5.991a6.176 6.176 0 00-1.038 3.446c0 1.343.425 2.588 1.147 3.607l-.013-.02-2.342 2.343a1.968 1.968 0 00-.58-.095h-.002a2.033 2.033 0 102.033 2.033 1.978 1.978 0 00-.1-.595l.005.014 2.317-2.317a6.247 6.247 0 104.782-11.134l-.036-.005zm-.964 9.378a3.206 3.206 0 113.215-3.207v.002a3.206 3.206 0 01-3.207 3.207z'),
  slack: fill('M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z'),

const chip = (cite, attrs = '') => `<span class="tag${attrs ? ' click' : ''}"${attrs}>${SRC_ICON[cite.src] || ''}${esc(cite.label)}</span>`
// Live search: case-insensitive substring; hl() escapes then wraps matches in <mark>.
let ROW_SORT = { co: '', mode: '' }  // click a company name: answered first -> unanswered first -> off
let Q = '', F_STATUS = '', F_TYPE = '', TAB = 'data', ANALYSIS = null
// One column sort at a time: key = last | answers | sources | people | q<i>; dir desc -> asc -> off. Off = most recent first.
let COL_SORT = { key: '', dir: '' }
const hl = t => { const e = esc(t); if (!Q) return e; const q = esc(Q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); return e.replace(new RegExp(q, 'gi'), m => `<mark>${m}</mark>`) }
const hay = c => [c.company, c.people, c.status, ...Object.values(c.cells).flat().flatMap(a => [a.a, a.cite.label, a.cite.quote])].join(' ').toLowerCase()
const SRC = { gong: 'Gong', hubspot: 'HubSpot', slack: 'Slack', interview: 'Interview' }
function renderAnalysis() {
  $('t').className = 'an'
  if (!ANALYSIS) { $('t').innerHTML = '<tbody><tr><td class="q">Loading analysis…</td></tr></tbody>'; return }
  const byName = Object.fromEntries(DATA.companies.map(c => [c.company, c]))
  const cites = names => { const n = names || []; return n.length ? `<span class="ci"><span class="tag cnt" title="${esc(n.join(', '))}">${ICON.co}${n.length}</span></span>` : '' }
  const pts = list => `<ul class="an-pts">${(list || []).map(p => `<li><span>${hl(p.text)}</span>${cites(p.companies)}</li>`).join('')}</ul>`
  const head = `<thead><tr><th class="q"></th><th>What we learned</th><th>Product hypothesis</th><th class="an-f">Feature</th></tr></thead>`
  const across = `<tr class="across"><td class="q"><span class="rt">Across all questions</span></td><td>${pts(ANALYSIS.cross)}</td><td colspan="2"><div class="an-h">Top product bets</div><ul class="an-pts">${(ANALYSIS.bets || []).map(b => `<li><span>${hl(b.text)}</span>${(b.qs || []).length ? `<span class="ci"><span class="tag cnt" title="${esc((b.qs || []).map(q => DATA.questions[+q.slice(1) - 1]).filter(Boolean).join('\n'))}">${ICON.q}${b.qs.length}</span></span>` : ''}</li>`).join('')}</ul></td></tr>`
  const rows = DATA.questions.map((q, i) => {
    const r = ANALYSIS.rows['Q' + (i + 1)] || {}
    return `<tr><td class="q"><span class="rt">${hl(q)}</span></td><td><div class="an-h">${hl(r.headline || '')}</div>${r.confidence ? `<span class="ci"><span class="tag conf-${esc(r.confidence)}">${esc(r.confidence[0].toUpperCase() + r.confidence.slice(1))} Confidence</span></span>` : ''}${pts(r.points)}</td><td>${hl(r.hypothesis || '')}</td><td class="an-f">${hl(r.feature || '')}${r.fit ? `<div class="fit"><span class="tag fit-${r.fit}">${r.fit === 'have' ? 'We Have This' : r.fit === 'extend' ? 'Extends Product' : 'Gap'}</span></div>` : ''}</td></tr>`
  }).join('')
  $('t').innerHTML = head + '<tbody>' + across + rows + '</tbody>'
}

function render() {
  $('t').hidden = TAB === 'story'; $('sv').hidden = TAB !== 'story'
  if (TAB === 'story') return Story.render()
  if (TAB === 'analysis') return renderAnalysis()
  $('t').className = ''
  $('gate').hidden = true; $('app').hidden = false
  const lastIso = c => Object.values(c.cells).flat().map(a => a.cite.iso || '').sort().pop() || ''
  const qMatchesQuestion = Q && DATA.questions.some(x => x.toLowerCase().includes(Q.toLowerCase()))
  let cos = DATA.companies.filter(c => (!F_TYPE || c.type === F_TYPE) && (!F_STATUS || (F_STATUS === 'none' ? !c.status : c.status === F_STATUS)) && (!Q || qMatchesQuestion || hay(c).includes(Q.toLowerCase())))
  const nAns = c => Object.values(c.cells).filter(v => v.length).length
  const nSrc = c => new Set(Object.values(c.cells).flat().map(a => a.cite.label)).size
  const nPpl = c => (c.people || '').split(' · ').filter(Boolean).length
  const metric = (c, k) => k === 'last' ? lastIso(c) : k === 'answers' ? nAns(c) : k === 'sources' ? nSrc(c) : k === 'people' ? nPpl(c) : +((c.cells['Q' + (+k.slice(1) + 1)] || []).length > 0)
  const cmp = (x, y) => typeof x === 'string' ? x.localeCompare(y) : x - y
  const { key, dir } = COL_SORT
  cos = [...cos].sort((a, b) => (key ? (dir === 'desc' ? cmp(metric(b, key), metric(a, key)) : cmp(metric(a, key), metric(b, key))) : 0) || lastIso(b).localeCompare(lastIso(a)))
  VIEW = cos
  const n = DATA.companies.reduce((t, c) => t + Object.values(c.cells).reduce((u, v) => u + v.length, 0), 0)
  const up = new Date(DATA.updatedAt)
  $('meta').innerHTML = [[ICON.co, DATA.companies.length, 'Companies'], [ICON.q, DATA.questions.length, 'Questions'], [ICON.a, n, 'Answers']].map(([i, v, t]) => `<span class="st" title="${t}">${i}${v}</span>`).join('') + `<span class="st" title="Updated">${ICON.clock}${ago(up)}</span>`
  const logo = c => c.logo ? `<img src="${esc(c.logo)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=ph></span>'">` : '<span class="ph"></span>'
  const head = `<thead><tr><th class="q"><button class="clr" id="clr">Reset</button></th>${cos.map(c => `<th class="coh" data-co="${esc(c.company)}"><div class="co">${logo(c)}<span>${hl(c.company)}</span>${ROW_SORT.co === c.company ? `<i class="arr" title="${ROW_SORT.mode === 'answered' ? 'Answered first' : 'Unanswered first'}">${ROW_SORT.mode === 'answered' ? ICON.up : ICON.down}</i>` : ''}</div></th>`).join('')}</tr></thead>`
  const cites = c => Object.values(c.cells).flat().map(a => a.cite)
  const last = c => cites(c).map(x => x.iso || '').sort().pop()
  const srcTags = c => { const seen = new Map(); cites(c).forEach(x => seen.has(x.label) || seen.set(x.label, x)); return [...seen.values()].sort((a, b) => a.label.localeCompare(b.label)).map(x => chip(x)).join('') }
  // column sorts reorder sideways: right = highest first, left = lowest first
  const arrow = k => COL_SORT.key === k ? `<i class="arr">${COL_SORT.dir === 'desc' ? ICON.right : ICON.left}</i>` : ''
  const row = (label, f, k) => `<tr class="prow${k === 'people' ? ' ppl-row' : ''}"><td class="q${k ? ' rs' : ''}"${k ? ` data-sort="${k}"` : ''}><span class="rl"><span class="rt">${label}</span>${k === 'status' || k === 'type' ? '' : arrow(k)}</span></td>${cos.map(c => `<td>${f(c)}</td>`).join('')}</tr>`
  const pplRow = row('Status', c => c.status ? `<span class="tag st-${c.status.toLowerCase()}">${c.status === 'Contracted' ? ICON.ok : ICON.no}${hl(c.status)}</span>` : '', 'status')
    + row('Type', c => c.type ? `<span class="tag ty ty-${c.type.toLowerCase()}">${c.type === 'Modern' ? ICON.modern : ICON.trad}${hl(c.type)}</span>` : '', 'type')
    + row('Last conversation', c => { const d = last(c); return d ? `<span class="dt">${ago(new Date(d + 'T12:00:00'))}</span>` : '' }, 'last')
    + row('Answers', c => `<span class="num">${nAns(c)}</span>`, 'answers')
    + row('Sources', c => `<div class="srcs">${srcTags(c)}</div>`, 'sources')
    + row('People', c => people(c.people, c.linkedin), 'people')
  const sel = ROW_SORT.co && DATA.companies.find(c => c.company === ROW_SORT.co)
  const has = i => sel && (sel.cells['Q' + (i + 1)] || []).length > 0
  const order = DATA.questions.map((_, i) => i)
  if (sel) order.sort((a, b) => ROW_SORT.mode === 'answered' ? has(b) - has(a) || a - b : has(a) - has(b) || a - b)
  const body = pplRow + order.map(i => [DATA.questions[i], i]).map(([q, i]) => `<tr><td class="q rs" data-sort="q${i}"><span class="rl"><span class="rt">${hl(q)}</span>${arrow('q' + i)}</span></td>${cos.map((c, ci) => `<td>${(c.cells['Q' + (i + 1)] || []).length ? '<div class="cell">' + (c.cells['Q' + (i + 1)]).map((a, ai) =>
    `<div class="ans"><span>${hl(a.a)}</span><div class="foot">${chip(a.cite, ` data-c="${ci}" data-q="${i + 1}" data-a="${ai}"`)}<span class="dt">${esc(a.cite.date || '')}</span></div></div>`).join('') + '</div>' : ''}</td>`).join('')}</tr>`).join('')
  $('t').innerHTML = head + '<tbody>' + body + '</tbody>'
}

function openDrawer(c, q, a) { openAnswer(VIEW[c], q, a) }
function openAnswer(co, q, a) {
  const ans = co.cells['Q' + q][a], s = ans.cite
  $('dTitle').textContent = co.company
  $('dSub').textContent = [SRC[s.src], s.title, s.date].filter(Boolean).join(' · ')
  const link = /^https:\/\//.test(s.url || '') ? `<a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">Open in ${SRC[s.src]} ↗</a>` : ''
  const tx = s.path ? `<button class="btn" id="dTx">Show full transcript</button>` : ''
  $('dBody').innerHTML = `<p class="lbl">Q${q}</p><p>${esc(DATA.questions[q - 1])}</p><p class="lbl" style="margin-top:1rem">Answer</p><p>${esc(ans.a)}</p><div class="src-quote">“${esc(s.quote)}”</div>${s.speaker ? `<p class="drawer-sub">${esc(s.speaker)}</p>` : ''}<div class="actions">${link}${tx}</div><div class="tx" id="dTxBody"></div>`
  if (s.path) $('dTx').onclick = () => showTranscript(s)
  $('drawer').classList.add('open'); $('scrim').classList.add('open')
}
async function showTranscript(s) {
  const el = $('dTxBody'); el.textContent = 'Loading…'
  const res = await authed(s.path)
  if (!res.ok) { el.textContent = `Could not load transcript (${res.status}).`; return }
  const text = await res.text()
  // Highlight the longest quote fragment found verbatim, then scroll to it.
  const frag = s.quote.split(/\s*\.\.\.\s*|…/).sort((x, y) => y.length - x.length)[0].trim()
  const at = frag ? text.toLowerCase().indexOf(frag.toLowerCase()) : -1
  el.innerHTML = at < 0 ? esc(text) : esc(text.slice(0, at)) + '<mark id="hit">' + esc(text.slice(at, at + frag.length)) + '</mark>' + esc(text.slice(at + frag.length))
  $('hit')?.scrollIntoView({ block: 'center' })
}
function closeDrawer() { $('drawer').classList.remove('open'); $('scrim').classList.remove('open') }

$('t').addEventListener('click', e => {
  if (e.target.closest('#clr')) {
    ROW_SORT = { co: '', mode: '' }; COL_SORT = { key: '', dir: '' }; F_STATUS = ''; F_TYPE = ''; Q = ''; $('q').value = ''
    render(); document.querySelector('.wrap').scrollTo({ top: 0, left: 0 })
    return
  }
  const rs = e.target.closest('td.rs')
  if (rs) {
    const k = rs.dataset.sort
    if (k === 'status') F_STATUS = F_STATUS === 'Contracted' ? 'Churned' : 'Contracted'
    else if (k === 'type') F_TYPE = F_TYPE === 'Modern' ? 'Traditional' : 'Modern'
    else COL_SORT = { key: k, dir: COL_SORT.key === k && COL_SORT.dir === 'desc' ? 'asc' : 'desc' }  // alternate; Reset clears
    render()
    // same as a company sort: clicked row right under the header, columns from the start
    document.querySelector('.wrap').scrollLeft = 0  // row stays put vertically; only back to the first company
    return
  }
  const h = e.target.closest('th.coh')
  if (h) {
    const co = h.dataset.co
    ROW_SORT = { co, mode: 'answered' }  // answered questions first; Reset clears
    render()
    // Sorting by a company = start reading it: first question under the header, its column right after the questions.
    if (ROW_SORT.co) {
      const col = [...document.querySelectorAll('th.coh')].find(x => x.dataset.co === co)
      const wrap = document.querySelector('.wrap')
      const firstQ = document.querySelector('tbody tr:not(.prow)')
      const top = firstQ ? firstQ.getBoundingClientRect().top - document.querySelector('thead').getBoundingClientRect().bottom : 0  // = height of the summary rows
      wrap.scrollTop = top  // column stays put horizontally; only jump to the first question
    }
    return
  } const t = e.target.closest('.tag.click'); if (t) openDrawer(+t.dataset.c, +t.dataset.q, +t.dataset.a) })
// One-click log out: drop the viewer session (not the Agent Keyboard owner login) and stop Google auto sign-in.
$('logout').onclick = () => { try { localStorage.removeItem(KEY) } catch {} window.google?.accounts?.id?.disableAutoSelect(); location.reload() }
document.querySelector('.tabs').addEventListener('click', async e => {
  const b = e.target.closest('.tab'); if (!b || b.dataset.tab === TAB) return
  TAB = b.dataset.tab
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b))
  document.querySelector('.wrap').scrollTo({ top: 0, left: 0 })
  if (DATA) render()
  if ((TAB === 'analysis' || TAB === 'story') && !ANALYSIS) {
    const res = await authed('answers/analysis.json')
    ANALYSIS = res.ok ? await res.json() : { rows: {}, cross: [], bets: [] }
    if (TAB === 'analysis' || TAB === 'story') render()
  }
})
$('q').addEventListener('input', e => { Q = e.target.value.trim(); if (DATA) render() })
// No zoom anywhere: iOS Safari ignores user-scalable=no, so block its pinch gestures and double-tap zoom too.
for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault(), { passive: false })
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault() }, { passive: false })
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false })
$('scrim').onclick = closeDrawer; $('dClose').onclick = closeDrawer
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer() })

// Story tab: a Snow White storyboard (frames in /answers/story/). Frames point at analysis findings as [question, point index].
const Story = (() => {
  const F = {
    '01': { when: 'Sunday, 9:40pm', title: 'The week closes without her',
      text: 'Time arrives from everywhere: paper sign-in sheets, timekeeping exports, VMS emails, app punches. It all lands in one place, and Denise is on her couch.',
      now: 'Monday morning she would be merging spreadsheets from five systems by hand.',
      qs: [['Q10', 0], ['Q7', 2]],
      fork: { ask: 'How does this firm pay its people?', q: 'Q1', opts: [
        { to: '02', label: 'Weekly, with a Monday cutoff', pt: 1 },
        { to: '01b', label: 'Same day, at clock-out', pt: 0 }] } },
    '01b': { when: 'Saturday, 4:12pm', title: 'Paid before he reaches his car',
      text: 'For a same-day payer there is no Monday. The check runs at clock-out: the punch is matched to where he actually was, and clean shifts pay out on their own. Denise only sees the exceptions.',
      now: 'Instant payers reconcile after paying, and claw back days later.',
      qs: [['Q1', 0], ['Q8', 0]], next: '04' },
    '02': { when: 'Monday, 7:00am', title: 'The chasing happened overnight',
      text: 'Her morning summary: every payment checked, missing client approvals already chased, and a short list that actually needs her. She finishes her coffee.',
      now: 'Monday and Tuesday are chase days, spent racing the cutoff.',
      qs: [['Q2', 0], ['Q11', 1]], next: '03' },
    '03': { when: 'Monday, 8:30am', title: 'One screen, biggest money first',
      text: 'Instead of thousands of rows, a handful of kinds of issue, each with its dollars. The spreadsheets stay closed.',
      now: 'Reviewers hop between Excel, a BI tool and the admin screen.',
      qs: [['Q12', 1], ['Q28', 2]], next: '04' },
    '04': { when: 'Monday, 9:15am', title: 'The worker says 8 hours. The client says 6.5.',
      text: 'Schedule, worker punch, client timecard, GPS and the photo of the sign-in sheet sit side by side. The answer is visible in seconds.',
      now: 'He said, she said, settled by instinct and a phone call.',
      qs: [['Q26', 0], ['Q4', 1]],
      fork: { ask: 'At this firm, whose word is final?', q: 'Q17', opts: [
        { to: '05', label: "The client's", pt: 0 },
        { to: '05b', label: "The worker's, for small gaps with a clean history", q: 'Q16', pt: 0 }] } },
    '05': { when: 'Monday, 9:20am', title: 'The facility signs off in one tap',
      text: 'The nurse coordinator gets the evidence pack on her phone and approves it mid-shift. No login, no email thread.',
      now: 'Ops relays between worker and facility for days.',
      qs: [['Q17', 0], ['Q35', 0]], next: '06' },
    '05b': { when: 'Monday, 9:20am', title: 'Small claims from clean workers just get paid',
      text: 'Under a few minutes, with a clean history, the worker is right. The claim is paid and logged, and Denise can review the log whenever she likes.',
      now: "Many already do this, invisibly, in someone's head.",
      qs: [['Q16', 0]], next: '06' },
    '06': { when: 'Monday, 9:31am', title: 'The worker hears back the same morning',
      text: "A text lands on her phone at the bus stop: the 1.5 hours are confirmed and on Friday's check.",
      now: 'Disputes delay pay by days to weeks, and she stops trusting the agency.',
      qs: [['Q21', 1], ['Q18', 1]], next: '07' },
    '07': { when: 'Monday, 10:05am', title: 'She says the rule once. It holds forever.',
      text: '"For this client, ignore gaps under seven minutes." One sentence becomes a rule the agent applies every week, visible to the whole team.',
      now: "Thresholds live in one person's head or a cheat sheet.",
      qs: [['Q36', 0]],
      fork: { ask: "Is this week's biggest correction over her authority limit?", q: 'Q34', opts: [
        { to: '08', label: "Yes, it's $4,800", pt: 0 },
        { to: '09', label: "No, it's within her cap", pt: 1 }] } },
    '08': { when: 'Monday, 10:40am', title: 'Big money goes up with a summary',
      text: 'Her controller sees one card on his phone: what happened, the evidence, the amount. He approves between meetings.',
      now: 'Supervisors hear about it only when it is already a catastrophe.',
      qs: [['Q34', 0]], next: '09' },
    '09': { when: 'Monday, 11:40am', title: 'Payroll goes out early',
      text: 'Everything is reconciled before the cutoff. She sends verified hours, breaks and extras straight into the payroll run.',
      now: 'Unresolved cases roll into next week as corrections.',
      qs: [['Q19', 0], ['Q5', 0]],
      fork: { ask: 'Then a dispute shows up. Where from?', q: 'Q13', opts: [
        { to: '10', label: 'The worker texts the next day', pt: 0 },
        { to: '10b', label: "The client's AP flags the invoice weeks later", pt: 2 }] } },
    '10': { when: 'Tuesday, 2:10pm', title: 'The dispute opens itself',
      text: "A worker's text is matched to the shift and opened as a case, with the evidence already attached. Denise barely has to touch it.",
      now: 'Disputes arrive by text, phone, email and tickets, and someone triages them all.',
      qs: [['Q13', 0]], next: '11' },
    '10b': { when: 'Four weeks later', title: 'The invoice defends itself',
      text: "The client's AP clerk circles a line. Before she can email, the proof arrives: location, sign-in sheet, the rule applied and who approved it.",
      now: 'Billing disputes arrive late, after the evidence is hard to find.',
      qs: [['Q13', 2], ['Q24', 0]], next: '11' },
    '11': { when: 'Month end', title: 'Volume triples. The team stays at three.',
      text: 'Denise shows the CFO two lines: shifts climbing, and the cases a person touched staying flat.',
      now: 'Manual review grows with every new shift.',
      qs: [['Q46', 0], ['Q37', 0]], next: '12' },
    '12': { when: 'Friday, 5:00pm', title: 'She goes home on time',
      text: 'Payroll was right, the clients trust the bills, and nobody chased anyone this week.',
      now: 'The pain was never the dollars. It was the hours.',
      qs: [['Q23', 0], ['Q38', 0]], end: true },
  }
  const FIT = { have: 'We Have This', extend: 'Extends Product', gap: 'Gap' }
  const fitTag = f => FIT[f] ? `<span class="tag fit-${f}">${FIT[f]}</span>` : ''
  const img = id => `/answers/story/frame-${id}.jpg`
  const row = q => ANALYSIS.rows[q] || { points: [] }
  const qNum = q => +q.slice(1)
  let path = ['01']

  function who(q, pt) {
    const byName = Object.fromEntries(DATA.companies.map(c => [c.company, c]))
    return (row(q).points[pt]?.companies || []).map(n => {
      const co = byName[n]; if (!co) return ''
      const ans = (co.cells[q] || []).map((a, ai) => `<button class="sv-ans" data-co="${esc(n)}" data-q="${qNum(q)}" data-a="${ai}">${esc(a.a)}${a.cite?.quote ? `<em>“${esc(a.cite.quote)}”</em>` : ''}<span class="tag">${esc(SRC[a.cite?.src] || '')}${a.cite?.date ? ' · ' + esc(a.cite.date) : ''}</span></button>`).join('')
      return `<div><div class="sv-co-h">${esc(n)}${co.type ? `<span class="tag ty-${esc(co.type.toLowerCase())}">${esc(co.type)}</span>` : ''}</div>${ans}</div>`
    }).join('')
  }

  function block(q, lit) {
    const r = row(q)
    const pts = r.points.map((p, i) => `<li class="sv-pt${i === lit ? ' lit' : ''}" data-q="${q}" data-i="${i}"><button aria-expanded="false"><span>${esc(p.text)}</span><span class="tag cnt">${ICON.co}${p.companies.length}</span></button></li>`).join('')
    return `<div class="sv-q"><span class="rt">${esc(DATA.questions[qNum(q) - 1])}</span>
      <div>${r.confidence ? `<span class="tag conf-${esc(r.confidence)}">${esc(r.confidence[0].toUpperCase() + r.confidence.slice(1))} Confidence</span>` : ''}</div>
      <div class="an-h">${esc(r.headline || '')}</div><ul class="sv-pts">${pts}</ul>
      <div class="sv-bet"><span class="lbl">If this is true</span><span>${esc(r.hypothesis || '')}</span><span class="lbl">So we build</span><span>${esc(r.feature || '')} ${fitTag(r.fit)}</span></div></div>`
  }

  function summary() {
    const seen = new Map(); path.forEach(p => F[p].qs.forEach(([q]) => seen.set(q, row(q))))
    const order = { gap: 0, extend: 1, have: 2 }
    return `<div class="sv-sum"><div class="sv-ask">What this path needs</div><ol>${[...seen.values()].sort((a, b) => (order[a.fit] ?? 3) - (order[b.fit] ?? 3)).map(r => `<li>${esc(r.feature || '')} ${fitTag(r.fit)}</li>`).join('')}</ol></div>`
  }

  function render() {
    const el = $('sv')
    if (!ANALYSIS) { el.innerHTML = '<p class="lbl">Loading story…</p>'; return }
    const id = path[path.length - 1], f = F[id]
    let act = ''
    if (f.fork) act = `<div class="sv-ask">${esc(f.fork.ask)}</div>${f.fork.opts.map(o => { const p = row(o.q || f.fork.q).points[o.pt]; return `<button class="sv-opt" data-to="${o.to}"><strong>${esc(o.label)}</strong>${p ? `<span>${p.companies.length} companies: ${esc(p.text)}</span>` : ''}</button>` }).join('')}`
    else if (f.next) act = `<button class="btn sv-next" data-to="${f.next}">Next →</button>`
    const qs = [...f.qs]; if (f.fork && !qs.some(x => x[0] === f.fork.q)) qs.push([f.fork.q, -1])
    el.innerHTML = `<div class="sv-head"><div><h2>Denise's payroll week</h2><p>The ideal week for a staffing firm's payroll lead, told in frames. Choose a path at each fork, and open any finding to see which customers said it.</p></div><button class="btn" data-restart>Start over</button></div>
      <nav class="sv-trail" aria-label="Your path">${path.map((p, i) => `<button data-i="${i}" ${i === path.length - 1 ? 'aria-current="step"' : ''} title="${esc(F[p].title)}"><img src="${img(p)}" alt=""><span class="lbl">${i + 1} · ${esc(F[p].when)}</span></button>`).join('')}</nav>
      <div class="sv-stage"><img class="sv-img" src="${img(id)}" alt="${esc(f.title)}">
        <div class="sv-story"><span class="lbl">The ideal · ${esc(f.when)}</span><h3>${esc(f.title)}</h3><p>${esc(f.text)}</p>
          <p class="sv-now"><b>How it works now:</b> ${esc(f.now)}</p>${act}${f.end ? summary() : ''}</div></div>
      <div class="sv-heard"><span class="lbl">What customers told us</span>${qs.map(([q, i]) => block(q, i)).join('')}</div>`
  }

  const go = id => { path.push(id); render(); document.querySelector('.wrap').scrollTo({ top: 0 }) }
  $('sv').addEventListener('click', e => {
    const to = e.target.closest('[data-to]'); if (to) return go(to.dataset.to)
    if (e.target.closest('[data-restart]')) { path = ['01']; return render() }
    const t = e.target.closest('.sv-trail button'); if (t) { path = path.slice(0, +t.dataset.i + 1); return render() }
    const a = e.target.closest('.sv-ans'); if (a) return openAnswer(DATA.companies.find(c => c.company === a.dataset.co), +a.dataset.q, +a.dataset.a)
    const b = e.target.closest('.sv-pt > button')
    if (b) {
      const li = b.parentElement, open = b.getAttribute('aria-expanded') === 'true'
      li.querySelector('.sv-who')?.remove(); b.setAttribute('aria-expanded', String(!open))
      if (!open) li.insertAdjacentHTML('beforeend', `<div class="sv-who">${who(li.dataset.q, +li.dataset.i)}</div>`)
    }
  })
  document.addEventListener('keydown', e => {
    if (TAB !== 'story' || !ANALYSIS || $('drawer').classList.contains('open') || e.target.closest('input')) return
    const f = F[path[path.length - 1]]
    if (e.key === 'ArrowRight' && f.next) go(f.next)
    if (e.key === 'ArrowLeft' && path.length > 1) { path.pop(); render() }
  })
  return { render }
})()

// Signed in: straight to the table (skeleton while data loads). Otherwise the sign-in card.
const s = session()
if (s) { skeleton(); load(s.sessionToken) } else signIn()
</script>
<script src="https://agent-keyboard.fly.dev/widget.js" data-site="closeout-jobs" defer></script>
</body>
</html>
