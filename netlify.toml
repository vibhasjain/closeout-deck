[build]
  command = "cd job-src && npm install && npm run build && cd ../product-src && npm install && npm run build && cd .. && sh scripts/assemble-dist.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/product/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Retired pages (Sep 25 2026 cleanup). The Payroll desk demos point at the product.
