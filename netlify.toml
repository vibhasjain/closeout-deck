[build]
  command = "cd shift-xray && npm install && npm run build && cd ../tasks && npm install && npm run build && cp -r dist/* . && cd ../job-src && npm install && npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[[edge_functions]]
  function = "linear"
  path = "/api/linear"

[[edge_functions]]
  function = "report-gate"
  path = "/report"

[[edge_functions]]
  function = "report-gate"
  path = "/report/*"

[[redirects]]
  from = "/research/*"
  to = "https://hypertrack.com/research"
  status = 301

[[redirects]]
  from = "/experiment/*"
  to = "/decks/closeout-scroll-world/:splat"
  status = 200
