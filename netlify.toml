[build]
  command = "cd shift-xray && npm install && npm run build && cd ../tasks && npm install && npm run build && cp -r dist/* ."
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[[edge_functions]]
  function = "linear"
  path = "/api/linear"

[[redirects]]
  from = "/"
  to = "https://hypertrack.com/closeout"
  status = 301

[[redirects]]
  from = "/experiment/*"
  to = "/decks/closeout-scroll-world/:splat"
  status = 200
