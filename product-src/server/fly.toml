app = "closeout-agent"
primary_region = "sjc"

[env]
  HOME = "/data"
  NODE_ENV = "production"
  PORT = "8080"

[mounts]
  source = "closeout_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
